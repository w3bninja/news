<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Signal — News Feed</title>
<style>
:root {
  --ink: #1b1f2a;
  --ink-soft: #4a5063;
  --paper: #f3f1ec;
  --paper-raised: #ffffff;
  --line: #dcd8cf;
  --accent: #b5501f;
  --accent-soft: #e8d9c8;
  --shadow: 0 1px 2px rgba(27,31,42,0.06), 0 8px 24px -12px rgba(27,31,42,0.12);
  --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #eae7df; --ink-soft: #b3aea0; --paper: #1a1815; --paper-raised: #232019;
    --line: #38352c; --accent: #e08a4f; --accent-soft: #3a2c1f;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"] {
  --ink: #eae7df; --ink-soft: #b3aea0; --paper: #1a1815; --paper-raised: #232019;
  --line: #38352c; --accent: #e08a4f; --accent-soft: #3a2c1f;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}
:root[data-theme="light"] {
  --ink: #1b1f2a; --ink-soft: #4a5063; --paper: #f3f1ec; --paper-raised: #ffffff;
  --line: #dcd8cf; --accent: #b5501f; --accent-soft: #e8d9c8;
  --shadow: 0 1px 2px rgba(27,31,42,0.06), 0 8px 24px -12px rgba(27,31,42,0.12);
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  margin: 0;
  padding: 0 1.5rem 4rem;
}

.masthead { max-width: 880px; margin: 0 auto; padding: 3rem 0 1.25rem; }
.masthead .kicker {
  font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent); display: flex; justify-content: space-between; margin-bottom: 0.9rem;
}
.masthead h1 { font-family: var(--font-display); font-size: clamp(2.2rem, 5.5vw, 3.2rem); font-weight: 400; letter-spacing: -0.01em; margin: 0 0 0.5rem; text-wrap: balance; }
.masthead p { font-size: 1.02rem; color: var(--ink-soft); max-width: 46rem; margin: 0; line-height: 1.55; }

/* Subject tabs */
.subject-tabs {
  max-width: 880px; margin: 0 auto; display: flex; align-items: center; gap: 0.35rem;
  border-bottom: 3px solid var(--ink); flex-wrap: wrap;
}
.subject-tab {
  font-family: var(--font-display); font-size: 1.05rem; background: none; border: none;
  color: var(--ink-soft); padding: 0.6rem 1rem 0.7rem; cursor: pointer; position: relative; top: 3px;
  border-bottom: 3px solid transparent;
}
.subject-tab:hover { color: var(--ink); }
.subject-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.subject-tab.active { color: var(--ink); border-bottom-color: var(--accent); }
.subject-tab .remove-x {
  margin-left: 0.4rem; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-soft);
  opacity: 0; transition: opacity 0.15s;
}
.subject-tab:hover .remove-x { opacity: 0.7; }
.subject-tab .remove-x:hover { color: var(--accent); opacity: 1; }
.subject-add {
  font-family: var(--font-mono); font-size: 0.85rem; background: none; border: none;
  color: var(--accent); cursor: pointer; padding: 0.6rem 0.6rem 0.7rem; position: relative; top: 3px;
}
.subject-add:hover { text-decoration: underline; }
.subject-add-form { display: none; align-items: center; gap: 0.4rem; padding: 0.5rem 0; }
.subject-add-form.show { display: flex; }
.subject-add-form input {
  font-family: var(--font-body); font-size: 0.85rem; padding: 0.35rem 0.55rem;
  border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink);
}
.subject-add-form button {
  font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.03em;
  background: var(--ink); color: var(--paper); border: none; border-radius: 6px; padding: 0.35rem 0.7rem; cursor: pointer;
}
.subject-add-form button:hover { background: var(--accent); }

.toolbar { max-width: 880px; margin: 1.25rem auto 0; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
.filters { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.filters button {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase;
  background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
  padding: 0.4rem 0.75rem; border-radius: 999px; cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s; white-space: nowrap;
}
.filters button:hover { border-color: var(--ink-soft); color: var(--ink); }
.filters button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filters button.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }

.toolbar-right { display: flex; align-items: center; gap: 1rem; }
.manage-btn, .refresh-btn {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase;
  background: none; border: none; color: var(--accent); cursor: pointer; padding: 0.4rem 0;
}
.manage-btn:hover, .refresh-btn:hover { text-decoration: underline; }
.manage-btn:focus-visible, .refresh-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.refresh-btn:disabled { opacity: 0.5; cursor: default; text-decoration: none; }
.refresh-status { font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-soft); }

main { max-width: 880px; margin: 1.75rem auto 0; }

.feed { display: flex; flex-direction: column; }
.card { display: grid; grid-template-columns: 5.5rem 1fr; gap: 1.1rem; padding: 1.35rem 0; border-bottom: 1px solid var(--line); position: relative; }
.card:last-child { border-bottom: none; }
.card-link { text-decoration: none; color: inherit; display: contents; }
.card:hover .card-title { color: var(--accent); }
.card-link:focus-visible .card-title { outline: 2px solid var(--accent); outline-offset: 4px; }

.card-date { font-family: var(--font-mono); font-size: 0.72rem; color: var(--ink-soft); padding-top: 0.2rem; }
.card-body { min-width: 0; }
.card-meta { display: flex; align-items: center; gap: 0.55rem; margin-bottom: 0.4rem; flex-wrap: wrap; }
.card-source { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-soft); }
.tag { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.04em; text-transform: uppercase; padding: 0.14rem 0.5rem; border-radius: 999px; border: 1px solid currentColor; }
.tag-live { border-style: dashed; }
.card-title { font-family: var(--font-display); font-size: 1.32rem; line-height: 1.28; margin: 0 0 0.4rem; text-wrap: balance; transition: color 0.15s; }
.card-dek { font-size: 0.95rem; line-height: 1.55; color: var(--ink-soft); margin: 0; max-width: 60ch; }

.card-actions { position: absolute; top: 1.35rem; right: 0; display: flex; gap: 0.4rem; }
.card-actions button {
  font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line);
  border-radius: 999px; padding: 0.14rem 0.55rem; cursor: pointer;
}
.card-actions button:hover { color: var(--accent); border-color: var(--accent); }

footer {
  max-width: 880px; margin: 3rem auto 0; padding-top: 1.5rem; border-top: 1px solid var(--line);
  font-size: 0.85rem; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
}
footer a { color: var(--ink-soft); }

.manage-cats {
  max-width: 880px; margin: 1rem auto 0; background: var(--paper-raised); border: 1px solid var(--line);
  border-radius: 10px; padding: 1.1rem 1.5rem; box-shadow: var(--shadow);
}
.manage-cats h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.05rem; margin: 0 0 0.75rem; }
.cat-list { display: flex; flex-direction: column; gap: 0.5rem; }
.cat-list-row { display: flex; align-items: center; gap: 0.5rem; }
.cat-list-row input[type="text"] {
  flex: 1; font-family: var(--font-body); font-size: 0.88rem; padding: 0.4rem 0.6rem;
  border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink);
}
.cat-count { font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-soft); min-width: 3.5rem; }
.cat-del { font-size: 0.7rem; color: var(--ink-soft); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 0.3rem 0.55rem; cursor: pointer; }
.cat-del:hover { color: #b5501f; border-color: #b5501f; }
.cat-add-row { display: flex; gap: 0.5rem; margin-top: 0.9rem; padding-top: 0.9rem; border-top: 1px solid var(--line); }
.cat-add-row input {
  flex: 1; font-family: var(--font-body); font-size: 0.88rem; padding: 0.45rem 0.6rem;
  border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink);
}
.cat-add-row input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cat-add-row button {
  font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase;
  background: var(--ink); color: var(--paper); border: none; border-radius: 6px; padding: 0.45rem 0.9rem; cursor: pointer;
}
.cat-add-row button:hover { background: var(--accent); }
.cat-add-row button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.feeds-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.9rem; padding-top: 0.9rem; border-top: 1px solid var(--line); }
.feeds-list h4 { font-family: var(--font-display); font-weight: 400; font-size: 0.95rem; margin: 0 0 0.3rem; }
.feed-row { display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; }
.feed-row .feed-url { flex: 1; color: var(--ink-soft); font-family: var(--font-mono); font-size: 0.75rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-row select { font-family: var(--font-body); font-size: 0.8rem; padding: 0.3rem 0.4rem; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.feed-add-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
.feed-add-row input[type="url"] {
  flex: 1; min-width: 10rem; font-family: var(--font-body); font-size: 0.85rem; padding: 0.4rem 0.55rem;
  border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink);
}
.feed-add-row select {
  font-family: var(--font-body); font-size: 0.85rem; padding: 0.4rem 0.55rem;
  border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink);
}
.feed-add-row button {
  font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.03em;
  background: var(--ink); color: var(--paper); border: none; border-radius: 6px; padding: 0.4rem 0.8rem; cursor: pointer;
}
.feed-add-row button:hover { background: var(--accent); }

@media (max-width: 560px) {
  .card { grid-template-columns: 1fr; gap: 0.3rem; }
  .card-date { order: -1; }
  .card-actions { position: static; margin-top: 0.5rem; }
}
</style>
</head>
<body>

<div class="masthead">
  <div class="kicker"><span>The Signal · Personal Digest</span><span id="clock"></span></div>
  <h1>Your subjects, your sources</h1>
  <p>One merged running feed per subject — refreshed live from real RSS, organized however you want, with as many subjects as you need.</p>
</div>

<div class="subject-tabs" id="subject-tabs"></div>

<div class="toolbar">
  <div class="filters" id="filters"></div>
  <div class="toolbar-right">
    <span class="refresh-status" id="refresh-status"></span>
    <button class="refresh-btn" id="refresh-btn" type="button">Refresh feeds</button>
    <button class="manage-btn" id="manage-toggle" type="button">Manage</button>
  </div>
</div>

<div class="manage-cats" id="manage-cats" hidden>
  <h3>Categories</h3>
  <div class="cat-list" id="cat-list"></div>
  <form class="cat-add-row" id="cat-add-form">
    <input type="text" id="cat-add-input" placeholder="New category name" required>
    <button type="submit">Add category</button>
  </form>

  <div class="feeds-list">
    <h4>RSS feeds for this subject</h4>
    <div id="feed-list"></div>
    <form class="feed-add-row" id="feed-add-form">
      <input type="url" id="feed-add-url" placeholder="https://example.com/feed/" required>
      <select id="feed-add-cat"></select>
      <button type="submit">Add feed</button>
    </form>
  </div>
</div>

<main id="main"></main>

<footer>
  <span>Your personal curation · organize freely, edit or remove anything</span>
  <span id="updated"></span>
</footer>

<script>
(function () {
  var SUBJECTS_KEY = 'signal-subjects-v1';
  var ACTIVE_SUBJECT_KEY = 'signal-active-subject-v1';
  var PALETTE = ['#6b5b95', '#2f6b4f', '#b5501f', '#1f5c78', '#9c3d5e', '#3d6b8a', '#7a6a1f', '#5e4a8a'];
  var PALETTE_DARK = ['#b6a8e0', '#7fc9a0', '#e08a4f', '#6fb8dc', '#d98ba8', '#7fb0d6', '#c9b45a', '#a996d9'];

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function slug(name) { return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || uid(); }

  // Curated starter feed sets, matched against a new subject's name by keyword.
  var STARTER_SETS = [
    {
      keywords: ['web dev', 'frontend', 'front-end', 'front end', 'javascript', 'css', 'html'],
      categories: ['Frameworks & Tooling', 'CSS & Layout', 'Performance'],
      feeds: [
        { url: 'https://css-tricks.com/feed/', cat: 'CSS & Layout' },
        { url: 'https://web.dev/feed.xml', cat: 'Performance' },
        { url: 'https://developer.mozilla.org/en-US/blog/rss.xml', cat: 'Frameworks & Tooling' }
      ]
    },
    {
      keywords: ['ai', 'artificial intelligence', 'machine learning', 'ml'],
      categories: ['Research', 'Industry', 'Tools'],
      feeds: [
        { url: 'https://www.technologyreview.com/topic/artificial-intelligence/feed', cat: 'Research' },
        { url: 'https://www.theverge.com/rss/ai-artificial-intelligence/index.xml', cat: 'Industry' }
      ]
    },
    {
      keywords: ['product management', 'product manager', 'pm'],
      categories: ['Strategy', 'Craft'],
      feeds: [
        { url: 'https://www.mindtheproduct.com/feed/', cat: 'Craft' },
        { url: 'https://www.lennysnewsletter.com/feed', cat: 'Strategy' }
      ]
    },
    {
      keywords: ['startup', 'startups', 'venture', 'business'],
      categories: ['Funding', 'Industry'],
      feeds: [
        { url: 'https://techcrunch.com/feed/', cat: 'Industry' }
      ]
    },
    {
      keywords: ['marketing', 'growth'],
      categories: ['Strategy', 'Channels'],
      feeds: [
        { url: 'https://blog.hubspot.com/marketing/rss.xml', cat: 'Strategy' }
      ]
    },
    {
      keywords: ['science', 'tech news', 'technology'],
      categories: ['Industry', 'Research'],
      feeds: [
        { url: 'https://feeds.arstechnica.com/arstechnica/index', cat: 'Industry' },
        { url: 'https://www.theverge.com/rss/index.xml', cat: 'Industry' }
      ]
    }
  ];

  function findStarterSet(name) {
    var n = name.toLowerCase();
    for (var i = 0; i < STARTER_SETS.length; i++) {
      var set = STARTER_SETS[i];
      for (var j = 0; j < set.keywords.length; j++) {
        if (n.indexOf(set.keywords[j]) >= 0) return set;
      }
    }
    return null;
  }

  function defaultSubjects() {
    var uxNews = {
      id: 'ux-news',
      name: 'UX News',
      categories: ['News', 'Conservative', 'UX', 'Web Design', 'Development'],
      feeds: [
        { url: 'https://feeds.arstechnica.com/arstechnica/index', cat: 'News' },
        { url: 'https://www.theverge.com/rss/index.xml', cat: 'News' },
        { url: 'https://techcrunch.com/feed/', cat: 'News' },
        { url: 'https://hnrss.org/frontpage', cat: 'News' },

        { url: 'https://www.nationalreview.com/feed/', cat: 'Conservative' },
        { url: 'https://thedispatch.com/feed', cat: 'Conservative' },
        { url: 'https://www.newsmax.com/rss/Politics/1/', cat: 'Conservative' },

        { url: 'https://www.smashingmagazine.com/feed/', cat: 'UX' },
        { url: 'https://www.nngroup.com/feed/rss/', cat: 'UX' },
        { url: 'https://uxdesign.cc/feed', cat: 'UX' },
        { url: 'https://uxplanet.org/feed', cat: 'UX' },
        { url: 'https://www.mindtheproduct.com/feed/', cat: 'UX' },

        { url: 'https://css-tricks.com/feed/', cat: 'Web Design' },
        { url: 'https://alistapart.com/main/feed/', cat: 'Web Design' },
        { url: 'https://tympanus.net/codrops/feed/', cat: 'Web Design' },
        { url: 'https://web.dev/feed.xml', cat: 'Web Design' },

        { url: 'https://developer.mozilla.org/en-US/blog/rss.xml', cat: 'Development' },
        { url: 'https://dev.to/feed', cat: 'Development' },
        { url: 'https://github.blog/feed/', cat: 'Development' },
        { url: 'https://blog.google/technology/ai/rss/', cat: 'Development' }
      ],
      liveItems: [],
      lastRefresh: null
    };
    return [uxNews];
  }

  function loadSubjects() {
    try {
      var s = JSON.parse(localStorage.getItem(SUBJECTS_KEY));
      if (s && s.length) return s;
    } catch (e) {}
    var seeded = defaultSubjects();
    saveSubjects(seeded);
    return seeded;
  }
  function saveSubjects(list) { localStorage.setItem(SUBJECTS_KEY, JSON.stringify(list)); }

  var subjects = loadSubjects();
  var activeSubjectId = localStorage.getItem(ACTIVE_SUBJECT_KEY) || subjects[0].id;
  if (!subjects.find(function (s) { return s.id === activeSubjectId; })) activeSubjectId = subjects[0].id;
  var activeFilter = 'all';

  function getActiveSubject() { return subjects.find(function (s) { return s.id === activeSubjectId; }); }
  function persist() { saveSubjects(subjects); }

  function isDark() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function catColor(cat, cats) {
    var idx = cats.indexOf(cat);
    if (idx < 0) idx = 0;
    var pal = isDark() ? PALETTE_DARK : PALETTE;
    return pal[idx % pal.length];
  }
  function formatDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso.slice(0, 10);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  async function refreshFeeds() {
    var subject = getActiveSubject();
    if (!subject.feeds.length) return;
    var btn = document.getElementById('refresh-btn');
    var status = document.getElementById('refresh-status');
    btn.disabled = true;
    status.textContent = 'Refreshing…';
    try {
      var feedUrls = subject.feeds.map(function (f) { return f.url; }).join(',');
      var res = await fetch('/api/rss?feeds=' + encodeURIComponent(feedUrls) + '&limit=6');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      var live = [];
      (data.feeds || []).forEach(function (feedResult) {
        var mapping = subject.feeds.find(function (f) { return f.url === feedResult.url; });
        var cat = (mapping && mapping.cat) || subject.categories[0] || 'General';
        (feedResult.items || []).forEach(function (it) {
          live.push({
            id: 'live-' + (it.link || it.title),
            title: it.title,
            source: it.source || feedResult.source || '',
            url: it.link,
            cat: cat,
            rawDate: it.pubDate,
            date: formatDate(it.pubDate),
            dek: it.description,
            live: true
          });
        });
      });
      subject.liveItems = live;
      subject.lastRefresh = new Date().toISOString();
      persist();
      status.textContent = 'Updated just now';
    } catch (err) {
      status.textContent = 'Refresh failed — try again later';
    } finally {
      btn.disabled = false;
      render();
    }
  }

  function renderSubjectTabs() {
    var bar = document.getElementById('subject-tabs');
    bar.innerHTML = '';
    subjects.forEach(function (s) {
      var btn = document.createElement('button');
      btn.className = 'subject-tab' + (s.id === activeSubjectId ? ' active' : '');
      btn.type = 'button';
      btn.textContent = s.name;
      btn.addEventListener('click', function () {
        activeSubjectId = s.id;
        activeFilter = 'all';
        localStorage.setItem(ACTIVE_SUBJECT_KEY, activeSubjectId);
        document.getElementById('manage-cats').hidden = true;
        render();
      });
      if (subjects.length > 1) {
        var x = document.createElement('span');
        x.className = 'remove-x';
        x.textContent = '✕';
        x.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (!confirm('Remove subject "' + s.name + '" and everything in it?')) return;
          subjects = subjects.filter(function (x2) { return x2.id !== s.id; });
          if (activeSubjectId === s.id) activeSubjectId = subjects[0].id;
          persist();
          render();
        });
        btn.appendChild(x);
      }
      bar.appendChild(btn);
    });

    var addBtn = document.createElement('button');
    addBtn.className = 'subject-add';
    addBtn.type = 'button';
    addBtn.textContent = '+ Add subject';
    addBtn.addEventListener('click', function () {
      document.getElementById('subject-add-form').classList.toggle('show');
      document.getElementById('subject-add-input').focus();
    });
    bar.appendChild(addBtn);

    var form = document.createElement('form');
    form.className = 'subject-add-form';
    form.id = 'subject-add-form';
    form.innerHTML = '<input type="text" id="subject-add-input" placeholder="Subject name, e.g. Product Design"><button type="submit">Create</button>';
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var input = document.getElementById('subject-add-input');
      var name = input.value.trim();
      if (!name) return;
      var starter = findStarterSet(name);
      var newSubject = {
        id: slug(name) + '-' + uid(),
        name: name,
        categories: starter ? starter.categories.slice() : ['General'],
        feeds: starter ? starter.feeds.map(function (f) { return { url: f.url, cat: f.cat }; }) : [],
        liveItems: [],
        lastRefresh: null
      };
      subjects.push(newSubject);
      activeSubjectId = newSubject.id;
      activeFilter = 'all';
      persist();
      render();
      if (newSubject.feeds.length) refreshFeeds();
    });
    bar.appendChild(form);
  }

  function render() {
    var subject = getActiveSubject();
    var cats = subject.categories;
    var items = subject.liveItems || [];

    renderSubjectTabs();

    var status = document.getElementById('refresh-status');
    status.textContent = subject.lastRefresh
      ? 'Last refreshed ' + new Date(subject.lastRefresh).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })
      : (subject.feeds.length ? '' : 'No feeds yet');

    var filterBar = document.getElementById('filters');
    filterBar.innerHTML = '';
    var allBtn = document.createElement('button');
    allBtn.textContent = 'All';
    allBtn.className = activeFilter === 'all' ? 'active' : '';
    allBtn.addEventListener('click', function () { activeFilter = 'all'; render(); });
    filterBar.appendChild(allBtn);
    cats.forEach(function (cat) {
      var btn = document.createElement('button');
      btn.textContent = cat;
      btn.className = activeFilter === cat ? 'active' : '';
      btn.addEventListener('click', function () { activeFilter = cat; render(); });
      filterBar.appendChild(btn);
    });

    // Category select in feed-add form
    var feedCatSel = document.getElementById('feed-add-cat');
    feedCatSel.innerHTML = '';
    cats.forEach(function (cat) {
      var opt = document.createElement('option');
      opt.value = cat; opt.textContent = cat;
      feedCatSel.appendChild(opt);
    });

    // Manage: categories
    var catList = document.getElementById('cat-list');
    catList.innerHTML = '';
    cats.forEach(function (cat, idx) {
      var row = document.createElement('div');
      row.className = 'cat-list-row';

      var input = document.createElement('input');
      input.type = 'text';
      input.value = cat;
      input.addEventListener('change', function () {
        var newName = input.value.trim();
        if (!newName || newName === cat) { input.value = cat; return; }
        cats[idx] = newName;
        (subject.liveItems || []).forEach(function (it) { if (it.cat === cat) it.cat = newName; });
        (subject.feeds || []).forEach(function (f) { if (f.cat === cat) f.cat = newName; });
        if (activeFilter === cat) activeFilter = newName;
        persist();
        render();
      });

      var count = document.createElement('span');
      count.className = 'cat-count';
      var n = items.filter(function (it) { return it.cat === cat; }).length;
      count.textContent = n + ' article' + (n === 1 ? '' : 's');

      var del = document.createElement('button');
      del.className = 'cat-del';
      del.type = 'button';
      del.textContent = 'Delete';
      del.addEventListener('click', function () {
        var remaining = cats.filter(function (c) { return c !== cat; });
        if (!remaining.length) remaining = ['General'];
        subject.categories = remaining;
        (subject.liveItems || []).forEach(function (it) { if (it.cat === cat) it.cat = remaining[0]; });
        if (activeFilter === cat) activeFilter = 'all';
        persist();
        render();
      });

      row.appendChild(input);
      row.appendChild(count);
      row.appendChild(del);
      catList.appendChild(row);
    });

    // Manage: feeds
    var feedList = document.getElementById('feed-list');
    feedList.innerHTML = '';
    if (!subject.feeds.length) {
      var none = document.createElement('div');
      none.className = 'feed-row';
      none.style.color = 'var(--ink-soft)';
      none.textContent = 'No RSS feeds yet for this subject.';
      feedList.appendChild(none);
    }
    subject.feeds.forEach(function (f, idx) {
      var row = document.createElement('div');
      row.className = 'feed-row';

      var urlSpan = document.createElement('span');
      urlSpan.className = 'feed-url';
      urlSpan.textContent = f.url;
      urlSpan.title = f.url;

      var catSel = document.createElement('select');
      cats.forEach(function (cat) {
        var opt = document.createElement('option');
        opt.value = cat; opt.textContent = cat;
        if (cat === f.cat) opt.selected = true;
        catSel.appendChild(opt);
      });
      catSel.addEventListener('change', function () {
        f.cat = catSel.value;
        persist();
      });

      var del = document.createElement('button');
      del.className = 'cat-del';
      del.type = 'button';
      del.textContent = 'Remove';
      del.addEventListener('click', function () {
        subject.feeds.splice(idx, 1);
        persist();
        render();
      });

      row.appendChild(urlSpan);
      row.appendChild(catSel);
      row.appendChild(del);
      feedList.appendChild(row);
    });

    // Merged feed — sorted, not grouped by category
    var main = document.getElementById('main');
    main.innerHTML = '';

    var filtered = items.filter(function (it) { return activeFilter === 'all' || it.cat === activeFilter; });
    filtered.sort(function (a, b) {
      var da = a.rawDate ? new Date(a.rawDate).getTime() : 0;
      var db = b.rawDate ? new Date(b.rawDate).getTime() : 0;
      if (da || db) return db - da;
      return 0;
    });

    if (!filtered.length) {
      var empty = document.createElement('p');
      empty.style.color = 'var(--ink-soft)';
      empty.textContent = subject.feeds.length
        ? 'Nothing in this category yet.'
        : 'Nothing here yet — add an RSS feed in Manage.';
      main.appendChild(empty);
      return;
    }

    var feed = document.createElement('div');
    feed.className = 'feed';

    filtered.forEach(function (it) {
      var card = document.createElement('div');
      card.className = 'card';

      var link = document.createElement('a');
      link.className = 'card-link';
      link.href = it.url;
      link.target = '_blank';
      link.rel = 'noopener';

      var dateDiv = document.createElement('div');
      dateDiv.className = 'card-date';
      dateDiv.textContent = it.date || '';

      var body = document.createElement('div');
      body.className = 'card-body';

      var meta = document.createElement('div');
      meta.className = 'card-meta';
      var source = document.createElement('span');
      source.className = 'card-source';
      source.textContent = it.source;
      var tag = document.createElement('span');
      tag.className = 'tag' + (it.live ? ' tag-live' : '');
      tag.style.color = catColor(it.cat, cats);
      tag.textContent = it.cat + (it.live ? ' · live' : '');
      meta.appendChild(source);
      meta.appendChild(tag);

      var title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = it.title;

      body.appendChild(meta);
      body.appendChild(title);
      if (it.dek) {
        var dek = document.createElement('p');
        dek.className = 'card-dek';
        dek.textContent = it.dek;
        body.appendChild(dek);
      }

      link.appendChild(dateDiv);
      link.appendChild(body);
      card.appendChild(link);

      var actions = document.createElement('div');
      actions.className = 'card-actions';

      var shareBtn = document.createElement('button');
      shareBtn.type = 'button';
      shareBtn.textContent = 'Share';
      shareBtn.addEventListener('click', function () {
        if (navigator.share) {
          navigator.share({ title: it.title, url: it.url }).catch(function () {});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(it.url).then(function () {
            var prev = shareBtn.textContent;
            shareBtn.textContent = 'Copied';
            setTimeout(function () { shareBtn.textContent = prev; }, 1200);
          }).catch(function () {});
        }
      });
      actions.appendChild(shareBtn);

      card.appendChild(actions);
      feed.appendChild(card);
    });

    main.appendChild(feed);
  }

  document.getElementById('manage-toggle').addEventListener('click', function () {
    var panel = document.getElementById('manage-cats');
    panel.hidden = !panel.hidden;
  });
  document.getElementById('refresh-btn').addEventListener('click', refreshFeeds);

  document.getElementById('cat-add-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var input = document.getElementById('cat-add-input');
    var name = input.value.trim();
    if (!name) return;
    var subject = getActiveSubject();
    if (subject.categories.indexOf(name) < 0) subject.categories.push(name);
    input.value = '';
    activeFilter = name;
    persist();
    render();
  });

  document.getElementById('feed-add-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var urlInput = document.getElementById('feed-add-url');
    var url = urlInput.value.trim();
    if (!url) return;
    var subject = getActiveSubject();
    var cat = document.getElementById('feed-add-cat').value || subject.categories[0];
    subject.feeds.push({ url: url, cat: cat });
    urlInput.value = '';
    persist();
    render();
    refreshFeeds();
  });

  var now = new Date();
  document.getElementById('clock').textContent = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  document.getElementById('updated').textContent = 'Page loaded ' + now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

  render();

  // Auto-refresh active subject once per day per visitor
  var active = getActiveSubject();
  var oneDay = 24 * 60 * 60 * 1000;
  if (active.feeds.length && (!active.lastRefresh || (Date.now() - new Date(active.lastRefresh).getTime()) > oneDay)) {
    refreshFeeds();
  }
})();
</script>
</body>
</html>
